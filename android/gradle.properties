org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true

# ---------- AdMob (hito 5) ----------
# Identificadores reales de tu app en AdMob (README, «Anuncios y compra»). Sin ellos, el build
# de release usa los de prueba de Google. El de debug usa siempre los de prueba.
# Quita el # del principio de cada línea y pon tus valores:
#azulejo.admob.appId=ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY
#azulejo.admob.interstitialId=ca-app-pub-XXXXXXXXXXXXXXXX/ZZZZZZZZZZ
#azulejo.admob.rewardedId=ca-app-pub-XXXXXXXXXXXXXXXX/WWWWWWWWWW
# Teléfonos de prueba, separados por comas: el ID que el SDK escribe en Logcat al pedir un
# anuncio («Use RequestConfiguration.Builder().setTestDeviceIds…»).
#azulejo.admob.testDevices=ABCDEF0123456789
# Solo para probar el mensaje de consentimiento europeo en un build de debug (necesita el
# teléfono en azulejo.admob.testDevices; los emuladores ya cuentan como de prueba):
#azulejo.ump.forceEea=true
